extends:
  - recommended

# Reglas apagadas a propósito (ver docs/04-api/openapi.yaml):
# - info-license: el proyecto aún no define licencia.
# - no-server-example.com: marca servidores con example.com o localhost, y los
#   nuestros son localhost (backend local y mock de Prism).
# - operation-4xx-response: GET /version no tiene errores de cliente posibles.
#
# Nota (H-09): la clave se escribía `no-server-example-com` (con guion); el nombre
# real de la regla lleva un punto: `no-server-example.com`.
rules:
  info-license: off
  no-server-example.com: off
  operation-4xx-response: off
