name: Secret scanning # Busca credenciales expuestas en el historial del repositorio.

on: # No usa filtros de ruta: cualquier cambio puede introducir un secreto.
  pull_request: # Escanea las propuestas antes de fusionarlas.
  push: # Escanea commits de todas las ramas, no solo main.
  schedule: # Revisa periódicamente el historial aunque no haya commits nuevos.
    - cron: "13 6 * * 1" # Programa el chequeo semanal del lunes en UTC.
  workflow_dispatch: # Permite iniciar un análisis manual.

permissions: # Limita el token y no solicita secretos para escanear.
  contents: read # Solo se necesita descargar el repositorio completo.

jobs: # Contiene el escaneo de secretos de punta a punta.
  gitleaks: # Analiza el historial completo con una imagen de versión fija.
    name: Gitleaks — historial completo # Aclara que no es una revisión exclusiva del último commit.
    runs-on: ubuntu-24.04 # Usa un runner con Docker disponible.
    timeout-minutes: 15 # Limita el tiempo de una revisión de historial extensa.
    steps: # Descarga la historia y ejecuta el detector sin publicar tokens.
      - name: Descargar todo el historial # Evita el checkout superficial que omite commits anteriores.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; SHA fijo para evitar cambios silenciosos de la acción.
        with: # Solicita todos los commits necesarios para escanear la historia.
          fetch-depth: 0 # Descarga el historial completo en lugar del commit de la ejecución.
          persist-credentials: false # Evita mantener el token de Git en el checkout.
      - name: Escanear el historial con Gitleaks # Falla si encuentra secretos y los redacta en los logs.
        run: docker run --rm --volume "${GITHUB_WORKSPACE}:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --log-opts="--all -p" --gitleaks-ignore-path=/repo/.gitleaksignore --redact=100 --exit-code=1 /repo # Usa la imagen v8.30.1 fijada por digest y omite solo fingerprints revisados.
