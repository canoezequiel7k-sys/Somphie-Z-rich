        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /staff/sessions/{sessionId}/payments:
    post:
      tags: [StaffBilling]
      operationId: registerCashPayment
      summary: Registrar un pago en efectivo
      description: Mismas reglas de monto y propina que el pago del participante (RN-BIL-03, RN-TIP-*), incluido el mínimo `min(minPaymentMinor, saldo)` (D-158) y los mismos errores (`TIP_NOT_ALLOWED` es `409`, D-147). Método `CASH_COUNTER`.
      security: [{staffJwt: []}]
      x-permission: payment.register_cash
