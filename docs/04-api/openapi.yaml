              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                alreadyDecided: {$ref: '#/components/examples/ProblemOrderAlreadyDecided'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/InternalError'}
