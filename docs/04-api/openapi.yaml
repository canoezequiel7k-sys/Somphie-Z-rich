              schema: {$ref: '#/components/schemas/StaffSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Cierre bloqueado
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                balancePending: {$ref: '#/components/examples/ProblemSessionBalancePending'}
        '500': {$ref: '#/components/responses/InternalError'}
  /staff/sessions/{sessionId}/force-close:
    post:
      tags: [StaffBilling]
      operationId: forceCloseSession
      summary: Cierre forzado con motivo
      description: |
        Cancela pedidos `PENDING_REVIEW` e ítems activos. Los pagos y propinas ya registrados **se conservan** (RN-SES-06, D-159).
        Si tras cancelar `balance < 0`, en la **misma transacción** se registra un reembolso simulado automático por el exceso
        (sin devolver propina; queda como un pago de tipo `REFUND` en el historial de la sesión y auditado con el actor).
        Si `balance > 0`, queda como **saldo no cobrado** en la auditoría y en el comprobante, que marca el cierre forzado.
      security: [{staffJwt: []}]
      x-permission: session.force_close
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
            example: {reason: El cliente se fue sin pagar}
      responses:
        '200':
          description: Sesión cerrada por la fuerza
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffSession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
