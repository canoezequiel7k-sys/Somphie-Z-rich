    post:
      tags: [StaffBilling]
      operationId: voidAdjustment
      summary: Anular un ajuste
      description: Con motivo, sesión `OPEN`. El Mozo solo anula los suyos y dentro de 10 min; el Dueño cualquiera. Error `ADJUSTMENT_NOT_VOIDABLE` (409).
