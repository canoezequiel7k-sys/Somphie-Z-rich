      summary: Reembolsar (se usa cuando el saldo es negativo)
      description: Monto ≤ pagado neto; motivo obligatorio. Los reembolsos no devuelven propina (RN-TIP-05). Error `REFUND_EXCEEDS_PAID` (409, trae `maxRefundMinor`).
      security: [{staffJwt: []}]
