        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /staff/sessions/{sessionId}/adjustments:
    post:
      tags: [StaffBilling]
      operationId: applyAdjustment
      summary: Aplicar un descuento, cortesía o ajuste
      description: |
        Con lock exclusivo. El importe se calcula y congela al aplicar (RN-ADJ-03). Todos los ajustes restan.
        `DISCOUNT_PERCENT` usa `percentBp` (1000 = 10 %); `DISCOUNT_AMOUNT` y `MANUAL_ADJUSTMENT` usan `amountMinor`; `COURTESY_ITEM` usa `orderItemId`.
        `adjustment.apply` está limitado por el rol: el Mozo, hasta el 15 % **acumulado** de los cargos brutos de la sesión (suma de todos sus ajustes vigentes, D-142);
        superar el límite exige `adjustment.apply_any` (`ADJUSTMENT_LIMIT_EXCEEDED`, 403).
        El importe de un `DISCOUNT_PERCENT` se redondea al centavo más cercano (la mitad hacia arriba).
        Errores: `ADJUSTMENT_INVALID` (422), `ADJUSTMENT_EXCEEDS_BALANCE` (409), `ADJUSTMENT_ITEM_INVALID` (409: ítem cancelado, aún sin aceptar (`PENDING`) o ya con cortesía), `SESSION_CLOSED` (409).
      security: [{staffJwt: []}]
      x-permission: adjustment.apply
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAdjustmentRequest'}
            examples:
              percent: {value: {kind: DISCOUNT_PERCENT, percentBp: 1000, reasonCode: SERVICE_ISSUE, reasonText: Demora en la entrega}}
              courtesy: {value: {kind: COURTESY_ITEM, orderItemId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d, reasonCode: COURTESY_HOUSE}}
      responses:
        '201':
          description: Ajuste aplicado
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffAdjustment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Sin permiso o por encima del límite del rol
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                limitExceeded: {$ref: '#/components/examples/ProblemAdjustmentLimitExceeded'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      tags: [StaffBilling]
      operationId: listAdjustments
      summary: Ajustes de la sesión (incluye el motivo interno)
      security: [{staffJwt: []}]
      x-permission: session.read
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Ajustes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/StaffAdjustment'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
