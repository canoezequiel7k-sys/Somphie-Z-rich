      x-permission: item.prepare
      parameters:
        - $ref: '#/components/parameters/StationId'
        - name: status
          in: query
          schema:
            type: array
            items: {$ref: '#/components/schemas/ItemStatus'}
          style: form
          explode: false
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Cola
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StationQueue'}
              example:
                items:
                  - {itemId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d, orderId: e91a7b3c-5d2f-4e8a-9b1c-3d5f7a9b1c2e, orderCode: '#042', tableLabel: Mesa 7, productName: Flat white, quantity: 2, optionsSummary: Grande · Avena, options: [{groupId: 3f9e1d2c-4b5a-4687-9a0b-c1d2e3f4a5b6, optionId: e5f6a7b8-c9d0-4e1f-9a2b-3c4d5e6f7081, groupName: Tamaño, optionName: Grande, priceDeltaMinor: 80000}, {groupId: 4a0f2e3d-5c6b-4798-8b1c-d2e3f4a5b6c7, optionId: f6a7b8c9-d0e1-4f2a-8b3c-4d5e6f708192, groupName: Leche, optionName: Avena, priceDeltaMinor: 60000}], note: Sin azúcar, status: QUEUED, queuedAt: '2026-10-11T15:04:01Z', delayed: false}
                  - {itemId: 2a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d, orderId: e91a7b3c-5d2f-4e8a-9b1c-3d5f7a9b1c2e, orderCode: '#031', tableLabel: Mesa 3, productName: Café histórico, quantity: 1, status: QUEUED, queuedAt: null, delayed: null, options: []}
                nextCursor: null
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
