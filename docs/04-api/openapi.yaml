    post:
      tags: [StaffOrders]
      operationId: acceptOrder
      summary: Aceptar un pedido (con exclusiones opcionales)
      description: |
        Actualización condicional `PENDING_REVIEW -> ACCEPTED`: gana la primera decisión. El TTL solo lo aplica el job; si el estado sigue `PENDING_REVIEW`, aceptar no consulta el tiempo transcurrido. Ítems a `QUEUED`; los excluidos a `CANCELLED` (no cobran).
        Errores 409: `ORDER_ALREADY_DECIDED` (trae quién y cuándo), `ORDER_EXPIRED`. Error 422: `ORDER_ALL_ITEMS_EXCLUDED` (usar rechazo).
      security: [{staffJwt: []}]
      x-permission: order.accept
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcceptOrderRequest'}
            example:
              excludedItems:
                - {itemId: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e, reason: OUT_OF_STOCK}
      responses:
        '200':
          description: Pedido aceptado
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffOrder'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
