  /staff/sessions/{sessionId}/close:
    post:
      tags: [StaffBilling]
      operationId: closeSession
      summary: Cierre normal de la sesión
      description: |
        Con lock exclusivo. Sin `Idempotency-Key`: es idempotente por naturaleza (ya cerrada devuelve `200`).
        Errores 409: `SESSION_HAS_PENDING_ORDERS` (`orderIds`), `SESSION_HAS_ACTIVE_ITEMS` (`itemIds`), `SESSION_BALANCE_PENDING` (`balanceMinor`).
      security: [{staffJwt: []}]
      x-permission: session.close
      parameters:
