    post:
      tags: [WaiterCalls]
      operationId: acknowledgeWaiterCall
      summary: Tomar un llamado (OPEN -> ACKNOWLEDGED)
      description: Si el estado no lo permite responde `STATE_CONFLICT` (409); si no existe, `WAITER_CALL_NOT_FOUND`.
      security: [{staffJwt: []}]
      x-permission: waiter_call.handle
      parameters:
        - $ref: '#/components/parameters/WaiterCallId'
      responses:
        '200':
          description: Llamado tomado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffWaiterCall'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /staff/waiter-calls/{waiterCallId}/resolve:
    post:
      tags: [WaiterCalls]
      operationId: resolveWaiterCall
      summary: Resolver un llamado (-> RESOLVED)
      security: [{staffJwt: []}]
      x-permission: waiter_call.handle
      parameters:
        - $ref: '#/components/parameters/WaiterCallId'
      responses:
        '200':
          description: Llamado resuelto
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffWaiterCall'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /events/stream:
    get:
      tags: [Realtime]
      operationId: streamEvents
      summary: Flujo de eventos SSE (pistas, no datos)
      description: |
        `scope=session` exige token de invitado; `scope=staff` exige JWT. Un alcance ajeno: `403 STREAM_SCOPE_FORBIDDEN`.
        Cada evento lleva `id` (`event_log.id`) para reanudar con `Last-Event-ID`; fuera de la retención de 48 h: `410 EVENT_ID_TOO_OLD`.
        Heartbeat: comentario `:` cada 25 s. El sobre y el catálogo de eventos están en `eventos.md`; los clientes ignoran tipos desconocidos.
      security: [{guestToken: []}, {staffJwt: []}]
      parameters:
        - name: scope
          in: query
          required: true
          schema: {type: string, enum: [session, staff]}
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: Flujo `text/event-stream`
          content:
            text/event-stream:
              schema: {type: string}
              example: |
                id: 128
                event: order.updated
                data: {"eventId":128,"type":"order.updated","aggregateType":"ORDER","aggregateId":"e91a7b3c-5d2f-4e8a-9b1c-3d5f7a9b1c2e","version":4,"sessionId":"5d3e8f10-2a4b-4c6d-9e8f-0a1b2c3d4e5f","occurredAt":"2026-10-11T15:05:00Z"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '410':
          description: El `Last-Event-ID` está fuera de retención (`EVENT_ID_TOO_OLD`); hacer refresco completo
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '500': {$ref: '#/components/responses/InternalError'}
  /version:
    get:
      tags: [System]
      operationId: getVersion
      summary: Versión de build y de contrato
      security: []
      responses:
        '200':
          description: Versiones
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersionInfo'}
              example: {build: 0.1.0, contractVersion: 0.4.1}
        '500': {$ref: '#/components/responses/InternalError'}
  /media/{path}:
    get:
      tags: [System]
      operationId: getMedia
      summary: Imagen del menú (solo desarrollo)
      description: En producción las imágenes se sirven como estáticos desde `MEDIA_BASE_URL`; el cliente arma la URL con `image.path` y `image.version`.
      security: []
      parameters:
        - name: path
          in: path
          required: true
          schema: {type: string}
          allowReserved: true
          example: menu/flat-white.webp
      responses:
        '200':
          description: Imagen
          content:
            image/webp: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    guestToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Token opaco de participante (256 bits), acotado a su sesión. Vence 24 h después del cierre (solo lectura).
    staffJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de cuenta de personal o dueño. Dura 15 min; se renueva con `/auth/refresh`.
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: Idioma preferido (`es-AR` por defecto; `en` disponible).
      schema: {type: string}
    Lang:
      name: lang
      in: query
      description: Alternativa a `Accept-Language`.
      schema: {type: string}
    RestaurantIdQuery:
      name: restaurantId
      in: query
      description: Restaurante del menú público (multi-sucursal simulada). Sin token, si falta se usa el predeterminado del despliegue. Con token manda el del token y, si difiere, responde `404` (RN-TEN-03).
      schema: {type: string, format: uuid}
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v4 por intento lógico; se reutiliza en los reintentos HTTP.
      schema: {type: string, format: uuid}
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Recomendada.
      schema: {type: string, format: uuid}
    LastEventId:
      name: Last-Event-ID
      in: header
      description: Último `eventId` recibido, para reanudar el flujo.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    TableCode:
      name: tableCode
      in: path
      required: true
      description: Código opaco del QR de la mesa (no deriva del número de mesa).
      schema: {type: string}
    ProductId:
      name: productId
      in: path
      required: true
      schema: {type: string, format: uuid}
    OptionId:
      name: optionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    OrderId:
      name: orderId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ItemId:
      name: itemId
      in: path
      required: true
      schema: {type: string, format: uuid}
    StationId:
      name: stationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ParticipantId:
      name: participantId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    TableId:
      name: tableId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AdjustmentId:
      name: adjustmentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    WaiterCallId:
      name: waiterCallId
      in: path
      required: true
      schema: {type: string, format: uuid}
  headers:
    ETag:
      description: ETag débil del menú (`catalogVersion` + idioma).
      schema: {type: string}
    Vary:
      description: Siempre `Accept-Language` en el menú.
      schema: {type: string}
    IdempotentReplayed:
      description: "`true` si la respuesta es una repetición guardada."
      schema: {type: string, enum: ['true']}
    RetryAfter:
      description: Segundos de espera antes de reintentar.
      schema: {type: integer}
  responses:
    BadRequest:
      description: Validación o cuerpo mal formado (`VALIDATION_FAILED`, `MALFORMED_REQUEST`, `IDEMPOTENCY_KEY_REQUIRED`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.somphiezurich.example/errors/validation-failed
            title: Datos inválidos
            status: 400
            code: VALIDATION_FAILED
            detail: Revisá los campos marcados.
            traceId: 9f1c2a7e4b
            fieldErrors:
              - {field: 'items[0].quantity', code: MAX_EXCEEDED, message: Máximo 20 por producto}
    Unauthorized:
      description: No autenticado o token vencido/revocado (`UNAUTHENTICATED`, `TOKEN_EXPIRED`, `TOKEN_REVOKED`, `INVALID_CREDENTIALS`, `REFRESH_TOKEN_REUSED`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.somphiezurich.example/errors/token-expired
            title: Sesión vencida
            status: 401
            code: TOKEN_EXPIRED
            traceId: 9f1c2a7e4b
    Forbidden:
      description: Sin permiso o fuera de alcance (`FORBIDDEN`, `ITEM_STATION_FORBIDDEN`, `SESSION_ACCESS_REVOKED`, `PASSWORD_CHANGE_REQUIRED`, `ACCOUNT_DISABLED`, `STREAM_SCOPE_FORBIDDEN`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.somphiezurich.example/errors/forbidden
            title: No tenés permiso
            status: 403
            code: FORBIDDEN
            traceId: 9f1c2a7e4b
    NotFound:
      description: No existe o es de otra sesión o restaurante (`RESOURCE_NOT_FOUND` y los `*_NOT_FOUND` específicos)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.somphiezurich.example/errors/order-not-found
            title: Pedido no encontrado
            status: 404
            code: ORDER_NOT_FOUND
            traceId: 9f1c2a7e4b
    Conflict:
      description: Conflicto de estado o concurrencia (`STATE_CONFLICT`, `OPTIMISTIC_LOCK_FAILED`, `IDEMPOTENCY_IN_PROGRESS` y los 409 específicos del catálogo de errores)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.somphiezurich.example/errors/state-conflict
            title: El estado cambió
            status: 409
            code: STATE_CONFLICT
            traceId: 9f1c2a7e4b
    Unprocessable:
      description: Regla de negocio violada con datos válidos (`ORDER_EMPTY`, `PAYMENT_AMOUNT_INVALID`, `PAYMENT_DECLINED`, `IDEMPOTENCY_KEY_REUSED`, `TIP_INVALID`, `TIP_EXCEEDS_LIMIT`, `ADJUSTMENT_INVALID`, etc.)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.somphiezurich.example/errors/order-empty
            title: El pedido está vacío
            status: 422
            code: ORDER_EMPTY
            traceId: 9f1c2a7e4b
    TooManyRequests:
      description: Límite de solicitudes o bloqueo temporal (`RATE_LIMITED`, `JOIN_CODE_RATE_LIMITED`, `ACCOUNT_TEMPORARILY_LOCKED`, `WAITER_CALL_COOLDOWN`)
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.somphiezurich.example/errors/rate-limited
            title: Demasiadas solicitudes
            status: 429
            code: RATE_LIMITED
            traceId: 9f1c2a7e4b
    InternalError:
      description: Error no previsto (`INTERNAL_ERROR`). Sin trazas ni datos internos.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.somphiezurich.example/errors/internal-error
            title: Algo salió mal
            status: 500
            code: INTERNAL_ERROR
            traceId: 9f1c2a7e4b
    ServiceUnavailable:
      description: Base o servicio no disponible (`SERVICE_UNAVAILABLE`)
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ItemActionOk:
      description: Pedido completo con el estado recalculado en la misma transacción
      headers:
        Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/StaffOrder'}
  examples:
    ProblemSessionAlreadyOpen:
      value:
        type: https://api.somphiezurich.example/errors/session-already-open
        title: La mesa ya tiene una sesión abierta
        status: 409
        code: SESSION_ALREADY_OPEN
        detail: Alguien abrió esta mesa hace unos segundos. Podés unirte con el código.
        traceId: 9f1c2a7e4b
    ProblemRestaurantClosed:
      value:
        type: https://api.somphiezurich.example/errors/restaurant-closed
        title: El local está cerrado
        status: 409
        code: RESTAURANT_CLOSED
        traceId: 9f1c2a7e4b
        extra: {opensAt: '2026-10-12T11:00:00Z'}
    ProblemJoinCodeInvalid:
      value:
        type: https://api.somphiezurich.example/errors/join-code-invalid
        title: Código incorrecto
        status: 403
        code: JOIN_CODE_INVALID
        traceId: 9f1c2a7e4b
    ProblemPriceChanged:
      value:
        type: https://api.somphiezurich.example/errors/price-changed
        title: Cambiaron algunos precios
        status: 409
        code: PRICE_CHANGED
        traceId: 9f1c2a7e4b
        extra:
          currentTotalMinor: 1520000
          items:
            - {productId: 9a2b4c6d-8e0f-4a1b-b3c5-d7e9f1a3b5c7, unitPriceMinor: 520000, available: true}
    ProblemProductUnavailable:
      value:
        type: https://api.somphiezurich.example/errors/product-unavailable
        title: Hay productos agotados
        status: 409
        code: PRODUCT_UNAVAILABLE
        traceId: 9f1c2a7e4b
        extra: {productIds: [77cd1e2f-3a4b-4c5d-8e6f-7a8b9c0d1e2f]}
    ProblemSessionClosed:
      value:
        type: https://api.somphiezurich.example/errors/session-closed
        title: La visita ya finalizó
        status: 409
        code: SESSION_CLOSED
        traceId: 9f1c2a7e4b
    ProblemPaymentExceedsBalance:
      value:
        type: https://api.somphiezurich.example/errors/payment-exceeds-balance
        title: El monto supera el saldo
        status: 409
        code: PAYMENT_EXCEEDS_BALANCE
        traceId: 9f1c2a7e4b
        extra: {balanceMinor: 805000}
    ProblemTipNotAllowed:
      value:
        type: https://api.somphiezurich.example/errors/tip-not-allowed
        title: Todavía no hay cargos para agregar propina
        status: 409
        code: TIP_NOT_ALLOWED
        traceId: 9f1c2a7e4b
    ProblemPaymentAmountInvalid:
      value:
        type: https://api.somphiezurich.example/errors/payment-amount-invalid
        title: El monto no es válido
        status: 422
        code: PAYMENT_AMOUNT_INVALID
        traceId: 9f1c2a7e4b
        extra: {minMinor: 50}  # saldo 50 < mínimo 100: minMinor ya viene calculado con el saldo (D-158)
    ProblemOrderAlreadyDecided:
      value:
        type: https://api.somphiezurich.example/errors/order-already-decided
        title: El pedido ya fue decidido
        status: 409
        code: ORDER_ALREADY_DECIDED
        detail: Mateo aceptó este pedido hace unos segundos.
        traceId: 9f1c2a7e4b
        extra: {decidedBy: Mateo, decidedAt: '2026-10-11T15:03:22Z', currentStatus: ACCEPTED}
    ProblemItemInvalidTransition:
      value:
        type: https://api.somphiezurich.example/errors/item-invalid-transition
        title: Ese paso no es posible
        status: 409
        code: ITEM_INVALID_TRANSITION
        traceId: 9f1c2a7e4b
        extra: {currentStatus: READY}
    ProblemSessionBalancePending:
      value:
        type: https://api.somphiezurich.example/errors/session-balance-pending
        title: Queda saldo por cobrar
        status: 409
        code: SESSION_BALANCE_PENDING
        traceId: 9f1c2a7e4b
        extra: {balanceMinor: 805000}
    ProblemRefundExceedsPaid:
      value:
        type: https://api.somphiezurich.example/errors/refund-exceeds-paid
        title: El reembolso supera lo pagado
        status: 409
        code: REFUND_EXCEEDS_PAID
        traceId: 9f1c2a7e4b
        extra: {maxRefundMinor: 500000}
    ProblemAdjustmentLimitExceeded:
      value:
        type: https://api.somphiezurich.example/errors/adjustment-limit-exceeded
        title: Requiere autorización del Dueño
        status: 403
        code: ADJUSTMENT_LIMIT_EXCEEDED
        traceId: 9f1c2a7e4b
        extra: {limitPercent: 15, limitMinor: 750000}
  schemas:
    Uuid: {type: string, format: uuid}
    Timestamp: {type: string, format: date-time}
    Currency:
      type: string
      enum: [ARS]
    MoneyMinor:
      type: integer
      format: int64
      minimum: 0
      description: Importe en centavos. Nunca negativo.
    SignedMoneyMinor:
      type: integer
      format: int64
      description: Importe en centavos con signo. Solo para saldos (`balanceMinor`), que pueden ser negativos tras una cancelación con pagos hechos.
    Problem:
      type: object
      description: RFC 7807 extendido. Los clientes se programan contra `code`.
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string, description: Código estable del catálogo de errores. Tolerar valores desconocidos.}
        detail: {type: string}
        traceId: {type: string}
        fieldErrors:
          type: array
          items: {$ref: '#/components/schemas/FieldError'}
        extra:
          type: object
          additionalProperties: true
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: {type: string}
        code: {type: string}
        message: {type: string}
    OrderStatus:
      type: string
      description: Los clientes toleran valores desconocidos.
      enum: [PENDING_REVIEW, ACCEPTED, REJECTED, CANCELLED, EXPIRED, IN_PREPARATION, READY, DELIVERED]
    ItemStatus:
      type: string
      enum: [PENDING, QUEUED, IN_PREPARATION, READY, DELIVERED, CANCELLED]
    TableSessionStatus:
      type: string
      enum: [OPEN, CLOSED]
    SessionCloseReason:
      type: string
      enum: [SETTLED, EMPTY, EXPIRED_EMPTY, FORCED]
    ParticipantRole:
      type: string
      description: "A lo sumo un `HOST` por sesión (RN-ACC-15). En una sesión abierta por el personal no hay `HOST` hasta que el primero se une (D-143)."
      enum: [HOST, MEMBER]
    TableDisplayStatus:
      type: string
      description: Prioridad si se cumplen varias `PENDING_ORDERS` > `IN_SERVICE` > `AWAITING_PAYMENT` > `READY_TO_CLOSE` > `OCCUPIED` > `FREE`.
      enum: [FREE, OCCUPIED, PENDING_ORDERS, IN_SERVICE, AWAITING_PAYMENT, READY_TO_CLOSE]
    PaymentKind:
      type: string
      enum: [PAYMENT, REFUND]
    PaymentMethod:
      type: string
      enum: [SIMULATED_ONLINE, CASH_COUNTER]
    PaymentStatus:
      type: string
      enum: [SUCCEEDED, FAILED, VOIDED]
    AdjustmentKind:
      type: string
      enum: [DISCOUNT_PERCENT, DISCOUNT_AMOUNT, COURTESY_ITEM, MANUAL_ADJUSTMENT]
    AdjustmentStatus:
      type: string
      enum: [APPLIED, VOIDED]
    AdjustmentReasonCode:
      type: string
      enum: [COURTESY_HOUSE, SERVICE_ISSUE, PROMOTION, STAFF, ERROR_CORRECTION, OTHER]
    RejectReasonCode:
      type: string
      enum: [OUT_OF_STOCK, KITCHEN_CLOSED, ITEM_UNAVAILABLE, OTHER]
    WaiterCallReason:
      type: string
      enum: [BILL, WATER, HELP, OTHER]
    WaiterCallStatus:
      type: string
      enum: [OPEN, ACKNOWLEDGED, RESOLVED, EXPIRED]
    MenuResponse:
      type: object
      required: [catalogVersion, locale, currency, restaurantOpen, categories]
      properties:
        catalogVersion: {type: integer, format: int64}
        locale: {type: string, description: Idioma efectivo tras el fallback.}
        currency: {$ref: '#/components/schemas/Currency'}
        restaurantOpen: {type: boolean}
        categories:
          type: array
          items: {$ref: '#/components/schemas/Category'}
    Category:
      type: object
      required: [id, name, sortOrder, products]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        sortOrder: {type: integer}
        products:
          type: array
          items: {$ref: '#/components/schemas/Product'}
    Product:
      type: object
      required: [id, name, priceMinor, available, station]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        description: {type: string}
        priceMinor: {$ref: '#/components/schemas/MoneyMinor'}
        available: {type: boolean}
        station: {type: string, description: "Código de estación (por ejemplo `BAR` o `KITCHEN`). Tolerar valores nuevos."}
        allergens:
          type: array
          items: {type: string}
        image: {$ref: '#/components/schemas/ProductImage'}
        optionGroups:
          type: array
          items: {$ref: '#/components/schemas/OptionGroup'}
    ProductImage:
      type: object
      description: La URL se arma con `MEDIA_BASE_URL` + `path`, usando `version` para invalidar caché.
      required: [path, version, alt]
      properties:
        path: {type: string}
        version: {type: integer}
        alt: {type: string}
    OptionGroup:
      type: object
      required: [id, name, selectionType, required, minSelections, maxSelections, options]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        selectionType: {type: string, enum: [SINGLE, MULTIPLE]}
        required: {type: boolean}
        minSelections: {type: integer, minimum: 0}
        maxSelections: {type: integer, minimum: 1}
        options:
          type: array
          items: {$ref: '#/components/schemas/Option'}
    Option:
      type: object
      required: [id, name, priceDeltaMinor, available, isDefault]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        priceDeltaMinor: {$ref: '#/components/schemas/MoneyMinor'}
        available: {type: boolean}
        isDefault: {type: boolean}
    PublicTable:
      type: object
      description: Estado público de una mesa. `restaurantId` (opcional) permite a la web pedir `GET /menu` del local correcto (D-144).
      required: [tableLabel, restaurantOpen, hasActiveSession, canOpen]
      properties:
        tableLabel: {type: string}
        restaurantId: {$ref: '#/components/schemas/Uuid'}
        restaurantOpen: {type: boolean}
        opensAt: {$ref: '#/components/schemas/Timestamp'}
        hasActiveSession: {type: boolean}
        canOpen: {type: boolean}
    OpenSessionRequest:
      type: object
      required: [displayName]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 30}
    JoinSessionRequest:
      type: object
      required: [displayName, joinCode]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 30}
        joinCode: {type: string, minLength: 6, maxLength: 6}
    Session:
      type: object
      required: [id, status, tableLabel, openedAt, readOnly]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        status: {$ref: '#/components/schemas/TableSessionStatus'}
        tableLabel: {type: string}
        openedAt: {$ref: '#/components/schemas/Timestamp'}
        closedAt: {$ref: '#/components/schemas/Timestamp'}
        readOnly: {type: boolean}
    Participant:
      type: object
      required: [id, displayName, role]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        displayName: {type: string}
        role: {$ref: '#/components/schemas/ParticipantRole'}
        revoked: {type: boolean, description: "`true` si el acceso fue retirado (RN-ACC-11). Opcional (D-145)."}
    SessionAccessResponse:
      type: object
      required: [session, participant, guestToken]
      properties:
        session: {$ref: '#/components/schemas/Session'}
        participant: {$ref: '#/components/schemas/Participant'}
        guestToken: {type: string}
        joinCode: {type: string, description: Solo para el `HOST` al abrir.}
    CurrentSession:
      type: object
      required: [session, participant]
      properties:
        session: {$ref: '#/components/schemas/Session'}
        participant: {$ref: '#/components/schemas/Participant'}
        joinCode: {type: string}
    JoinCodeResponse:
      type: object
      required: [joinCode]
      properties:
        joinCode: {type: string}
    CreateOrderItem:
      type: object
      required: [productId, quantity]
      properties:
        productId: {$ref: '#/components/schemas/Uuid'}
        quantity: {type: integer, minimum: 1, maximum: 20}
        optionIds:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/Uuid'}
        note: {type: string, maxLength: 140}
    CreateOrderRequest:
      type: object
      description: Ningún campo lleva precios unitarios; el servidor calcula todo.
      required: [items, acknowledgedTotalMinor]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 30
          items: {$ref: '#/components/schemas/CreateOrderItem'}
        note: {type: string, maxLength: 140}
        acknowledgedTotalMinor: {$ref: '#/components/schemas/MoneyMinor'}
    CreateStaffOrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 30
          items: {$ref: '#/components/schemas/CreateOrderItem'}
        participantId:
          allOf:
            - {$ref: '#/components/schemas/Uuid'}
          description: Participante asociado a esta sesión, si corresponde.
        note: {type: string, maxLength: 140}
        acknowledgedTotalMinor: {$ref: '#/components/schemas/MoneyMinor'}
    OrderItemOption:
      type: object
      required: [groupId, optionId, groupName, optionName, priceDeltaMinor]
      properties:
        groupId: {$ref: '#/components/schemas/Uuid'}
        optionId: {$ref: '#/components/schemas/Uuid'}
        groupName: {type: string}
        optionName: {type: string}
        priceDeltaMinor: {$ref: '#/components/schemas/MoneyMinor'}
    OrderItem:
      type: object
      required: [id, productId, productName, basePriceMinor, optionsDeltaMinor, unitPriceMinor, quantity, lineTotalMinor, station, status]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        productId: {$ref: '#/components/schemas/Uuid'}
        productName: {type: string, description: Nombre en es-AR (snapshot).}
        productNameI18n:
          type: object
          additionalProperties: {type: string}
          description: Nombre por idioma (snapshot) para que el cliente vea su historial en su idioma.
        basePriceMinor: {$ref: '#/components/schemas/MoneyMinor'}
        optionsDeltaMinor: {$ref: '#/components/schemas/MoneyMinor'}
        unitPriceMinor: {$ref: '#/components/schemas/MoneyMinor'}
        quantity: {type: integer, minimum: 1}
        lineTotalMinor: {$ref: '#/components/schemas/MoneyMinor'}
        station: {type: string}
        status: {$ref: '#/components/schemas/ItemStatus'}
        note: {type: string}
        queuedAt: {$ref: '#/components/schemas/Timestamp'}
        startedAt: {$ref: '#/components/schemas/Timestamp'}
        readyAt: {$ref: '#/components/schemas/Timestamp'}
        deliveredAt: {$ref: '#/components/schemas/Timestamp'}
        cancelledAt: {$ref: '#/components/schemas/Timestamp'}
        options:
          type: array
          items: {$ref: '#/components/schemas/OrderItemOption'}
    Order:
      type: object
      required: [id, displayCode, status, version, createdAt, items, totalMinor]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        displayCode: {type: string, description: "Código corto secuencial por día de negocio (por ejemplo `#042`)."}
        status: {$ref: '#/components/schemas/OrderStatus'}
        version: {type: integer, description: Permite descartar eventos o respuestas atrasadas.}
        createdBy:
          type: object
          description: Se omite para Cocina. Identifica al participante o al empleado que creó el pedido.
          oneOf:
            - required: [participantId, displayName]
            - required: [userId, displayName]
          properties:
            participantId: {$ref: '#/components/schemas/Uuid'}
            userId: {$ref: '#/components/schemas/Uuid'}
            displayName: {type: string}
        participant:
          type: object
          description: Participante asociado a un pedido creado por personal.
          required: [participantId, displayName]
          properties:
            participantId: {$ref: '#/components/schemas/Uuid'}
            displayName: {type: string}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        note: {type: string}
        rejection:
          type: object
          description: "Motivo visible; aparece solo en pedidos rechazados (D-145)."
          required: [reasonCode]
          properties:
            reasonCode: {$ref: '#/components/schemas/RejectReasonCode'}
            reasonText: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/OrderItem'}
        totalMinor: {$ref: '#/components/schemas/MoneyMinor'}
    OrderPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Order'}
        nextCursor: {type: [string, 'null']}
    StaffOrderItem:
      allOf:
        - $ref: '#/components/schemas/OrderItem'
        - type: object
          properties:
            productCurrentlyAvailable: {type: boolean}
    StaffOrder:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [sessionId, tableLabel]
          properties:
            sessionId: {$ref: '#/components/schemas/Uuid'}
            tableLabel: {type: string}
            decidedBy:
              type: object
              required: [displayName]
              properties:
                userId: {$ref: '#/components/schemas/Uuid'}
                displayName: {type: string}
            decidedAt: {$ref: '#/components/schemas/Timestamp'}
            items:
              type: array
              items: {$ref: '#/components/schemas/StaffOrderItem'}
    StaffOrderPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/StaffOrder'}
        nextCursor: {type: [string, 'null']}
    AcceptOrderRequest:
      type: object
      properties:
        excludedItems:
          type: array
          items:
            type: object
            required: [itemId, reason]
            properties:
              itemId: {$ref: '#/components/schemas/Uuid'}
              reason: {$ref: '#/components/schemas/RejectReasonCode'}
    RejectOrderRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode: {$ref: '#/components/schemas/RejectReasonCode'}
        reasonText: {type: string, maxLength: 140}
    CancelItemRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 140}
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 140}
    Station:
      type: object
      required: [id, code, name]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        code: {type: string}
        name: {type: string}
    StationQueueItem:
      type: object
      required: [itemId, orderId, orderCode, tableLabel, productName, quantity, status, queuedAt, delayed]
      properties:
        itemId: {$ref: '#/components/schemas/Uuid'}
        orderId: {$ref: '#/components/schemas/Uuid'}
        orderCode: {type: string}
        tableLabel: {type: string}
        productName: {type: string}
        quantity: {type: integer}
        optionsSummary: {type: string}
        options:
          type: array
          items: {$ref: '#/components/schemas/OrderItemOption'}
        note: {type: string}
        status: {$ref: '#/components/schemas/ItemStatus'}
        queuedAt: {type: [string, 'null'], format: date-time, description: Timestamp persistido en el ítem; null si falta en registros históricos.}
        delayed: {type: [boolean, 'null'], description: null si falta acceptedAt y el SLA no puede evaluarse.}
    StationQueue:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/StationQueueItem'}
        nextCursor: {type: [string, 'null']}
    BillLine:
      type: object
      required: [orderCode, productName, quantity, unitPriceMinor, lineTotalMinor]
      properties:
        orderCode: {type: string}
        productName: {type: string}
        quantity: {type: integer}
        unitPriceMinor: {$ref: '#/components/schemas/MoneyMinor'}
        lineTotalMinor: {$ref: '#/components/schemas/MoneyMinor'}
    BillAdjustment:
      type: object
      description: Vista del participante. El motivo interno no se expone.
      required: [id, kind, label, amountMinor]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        kind: {$ref: '#/components/schemas/AdjustmentKind'}
        label: {type: string}
        amountMinor: {$ref: '#/components/schemas/MoneyMinor'}
    Payment:
      type: object
      required: [id, kind, method, status, amountMinor, tipMinor, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        kind: {$ref: '#/components/schemas/PaymentKind'}
        method: {$ref: '#/components/schemas/PaymentMethod'}
        status: {$ref: '#/components/schemas/PaymentStatus'}
        amountMinor: {$ref: '#/components/schemas/MoneyMinor'}
        tipMinor: {$ref: '#/components/schemas/MoneyMinor'}
        payerName: {type: string}
        payerLabel: {type: string}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
    Bill:
      type: object
      description: "`balanceMinor = chargesMinor - adjustmentsMinor - paidMinor`; la propina no entra."
      required: [currency, chargesMinor, adjustmentsMinor, paidMinor, balanceMinor, tipsMinor, lines, adjustments, payments]
      properties:
        currency: {$ref: '#/components/schemas/Currency'}
        chargesMinor: {$ref: '#/components/schemas/MoneyMinor'}
        adjustmentsMinor: {$ref: '#/components/schemas/MoneyMinor'}
        paidMinor: {$ref: '#/components/schemas/MoneyMinor'}
        balanceMinor: {$ref: '#/components/schemas/SignedMoneyMinor'}
        tipsMinor: {$ref: '#/components/schemas/MoneyMinor'}
        lines:
          type: array
          items: {$ref: '#/components/schemas/BillLine'}
        adjustments:
          type: array
          items: {$ref: '#/components/schemas/BillAdjustment'}
        payments:
          type: array
          items: {$ref: '#/components/schemas/Payment'}
        pendingOrdersNotIncluded:
          type: array
          items:
            type: object
            required: [orderCode, totalMinor]
            properties:
              orderCode: {type: string}
              totalMinor: {$ref: '#/components/schemas/MoneyMinor'}
    CreatePaymentRequest:
      type: object
      description: "`amountMinor` entre `min(minPaymentMinor, saldo)` y el saldo (D-158); `0` solo si `tipMinor > 0`."
      required: [amountMinor, method]
      properties:
        amountMinor: {$ref: '#/components/schemas/MoneyMinor'}
        tipMinor: {$ref: '#/components/schemas/MoneyMinor'}
        method: {type: string, enum: [SIMULATED_ONLINE]}
    CreateCashPaymentRequest:
      type: object
      required: [amountMinor]
      properties:
        amountMinor: {$ref: '#/components/schemas/MoneyMinor'}
        tipMinor: {$ref: '#/components/schemas/MoneyMinor'}
        payerLabel: {type: string}
    CreateRefundRequest:
      type: object
      required: [amountMinor, reason]
      properties:
        amountMinor: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 140}
    PaymentResult:
      type: object
      required: [payment, bill]
      properties:
        payment: {$ref: '#/components/schemas/Payment'}
        bill: {$ref: '#/components/schemas/Bill'}
    CreateAdjustmentRequest:
      type: object
      description: |
        Según `kind`: `DISCOUNT_PERCENT` → `percentBp`; `DISCOUNT_AMOUNT` y `MANUAL_ADJUSTMENT` → `amountMinor`; `COURTESY_ITEM` → `orderItemId`.
        El servidor rechaza combinaciones incoherentes con `ADJUSTMENT_INVALID`.
      required: [kind, reasonCode]
      properties:
        kind: {$ref: '#/components/schemas/AdjustmentKind'}
        percentBp: {type: integer, minimum: 1, maximum: 10000, description: "Puntos básicos (1000 = 10 %)."}
        amountMinor: {type: integer, format: int64, minimum: 1}
        orderItemId: {$ref: '#/components/schemas/Uuid'}
        reasonCode: {$ref: '#/components/schemas/AdjustmentReasonCode'}
        reasonText: {type: string, maxLength: 140}
    StaffAdjustment:
      type: object
      description: Vista del personal; incluye el motivo interno.
      required: [id, kind, status, amountMinor, reasonCode, appliedAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        kind: {$ref: '#/components/schemas/AdjustmentKind'}
        status: {$ref: '#/components/schemas/AdjustmentStatus'}
        amountMinor: {$ref: '#/components/schemas/MoneyMinor'}
        percentBp: {type: integer}
        orderItemId: {$ref: '#/components/schemas/Uuid'}
        reasonCode: {$ref: '#/components/schemas/AdjustmentReasonCode'}
        reasonText: {type: string}
        appliedBy: {type: string, description: Nombre visible de quien lo aplicó.}
        appliedAt: {$ref: '#/components/schemas/Timestamp'}
        voidedAt: {$ref: '#/components/schemas/Timestamp'}
        voidReason: {type: string}
    CreateWaiterCallRequest:
      type: object
      required: [reason]
      properties:
        reason: {$ref: '#/components/schemas/WaiterCallReason'}
        text: {type: string, maxLength: 80}
    WaiterCall:
      type: object
      required: [id, reason, status, createdAt]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        reason: {$ref: '#/components/schemas/WaiterCallReason'}
        text: {type: string}
        status: {$ref: '#/components/schemas/WaiterCallStatus'}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        acknowledgedAt: {$ref: '#/components/schemas/Timestamp'}
        resolvedAt: {$ref: '#/components/schemas/Timestamp'}
    StaffWaiterCall:
      allOf:
        - $ref: '#/components/schemas/WaiterCall'
        - type: object
          required: [sessionId, tableLabel]
          properties:
            sessionId: {$ref: '#/components/schemas/Uuid'}
            tableLabel: {type: string}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string}
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresInSec]
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}
        expiresInSec: {type: integer}
    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user]
          properties:
            user: {$ref: '#/components/schemas/Me'}
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, format: password}
        newPassword: {type: string, format: password, minLength: 10}
    Me:
      type: object
      required: [id, email, displayName, roles, permissions, stations, mustChangePassword]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        email: {type: string, format: email}
        displayName: {type: string}
        roles:
          type: array
          items: {type: string}
        permissions:
          type: array
          items: {type: string}
        stations:
          type: array
          items: {$ref: '#/components/schemas/Station'}
        mustChangePassword: {type: boolean}
    StaffTable:
      type: object
      required: [tableId, label, displayStatus, pendingOrdersCount, waiterCallActive]
      properties:
        tableId: {$ref: '#/components/schemas/Uuid'}
        label: {type: string}
        displayStatus: {$ref: '#/components/schemas/TableDisplayStatus'}
        sessionId: {$ref: '#/components/schemas/Uuid'}
        openedAt: {$ref: '#/components/schemas/Timestamp'}
        pendingOrdersCount: {type: integer, minimum: 0}
        balanceMinor: {$ref: '#/components/schemas/SignedMoneyMinor'}
        waiterCallActive: {type: boolean}
    StaffTableBoard:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/StaffTable'}
    StaffSession:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          properties:
            tableId: {$ref: '#/components/schemas/Uuid'}
            closeReason: {$ref: '#/components/schemas/SessionCloseReason'}
    StaffSessionDetail:
      type: object
      required: [session, participants, orders, bill]
      properties:
        session: {$ref: '#/components/schemas/StaffSession'}
        participants:
          type: array
          items: {$ref: '#/components/schemas/Participant'}
        orders:
          type: array
          items: {$ref: '#/components/schemas/StaffOrder'}
        bill: {$ref: '#/components/schemas/Bill'}
    StaffOpenSessionResponse:
      type: object
      required: [session, joinCode]
      properties:
        session: {$ref: '#/components/schemas/Session'}
        joinCode: {type: string}
    AvailabilityRequest:
      type: object
      required: [available]
      properties:
        available: {type: boolean}
    AvailabilityResult:
      type: object
      required: [id, available]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        available: {type: boolean}
    VersionInfo:
      type: object
      required: [build, contractVersion]
      properties:
        build: {type: string}
        contractVersion: {type: string}
