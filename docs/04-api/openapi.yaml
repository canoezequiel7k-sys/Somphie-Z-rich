      description: |
        El pedido se auto-acepta y queda auditado con el actor. Fuera de horario el personal puede crear pedidos (RN-ORD-07).
        `acknowledgedTotalMinor` es opcional: si se envía y no coincide, `409 PRICE_CHANGED`.
      security: [{staffJwt: []}]
