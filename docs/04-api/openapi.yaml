  /staff/stations/{stationId}/queue:
    get:
      tags: [Preparation]
      operationId: getStationQueue
      summary: Cola FIFO de una estación
      description: |
        Ítems `QUEUED` e `IN_PREPARATION` de pedidos aceptados, ordenados por `acceptedAt` ascendente y `itemId` como desempate estable. Los históricos sin `acceptedAt` aparecen al final ordenados por ID; ese grupo no tiene orden FIFO reconstruible.
        `delayed` se calcula desde `acceptedAt` y el SLA configurado; vale `null` si falta ese dato. `queuedAt` conserva el timestamp del ítem y vale `null` si no fue persistido.
        La paginación keyset es de consistencia eventual: inserciones y cambios de estado entre páginas pueden causar omisiones o alterar páginas posteriores; refrescar la cola obtiene el estado actual. No se garantiza un snapshot entre requests. Los cursores previos a 0.3.0 quedan invalidados; ante `VALIDATION_FAILED`, iniciar una lectura sin cursor.
