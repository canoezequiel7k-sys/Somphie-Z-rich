openapi: 3.1.0
info:
  title: Somphie Zúrich API
  version: 0.4.1
  summary: Contrato REST del backend de Somphie Zúrich (pedidos por QR, operación del personal, cuenta y pagos simulados).
  description: |
    Fuente de verdad del contrato (ADR-0008). Todo cambio se hace **primero aquí** y en `CHANGELOG.md`.
    Documentos de apoyo: `endpoints.md`, `convenciones.md`, `catalogo-errores.md`, `eventos.md`, `idempotencia-concurrencia.md`.

    ## Convenciones
    - Base `/api/v1`. JSON UTF-8 en `camelCase`. IDs UUID. Fechas ISO-8601 UTC con `Z`.
    - Dinero: enteros en centavos (`*Minor`). La moneda viaja en `currency` (ARS).
    - Los campos opcionales **se omiten** (nunca se envía `null`).
    - Los clientes deben tolerar valores de enum desconocidos y campos nuevos.
    - El servidor calcula **todos** los precios y estados. Ningún request lleva precios unitarios.

    ## Autenticación
    - `guestToken`: token opaco de participante (acotado a su sesión).
    - `staffJwt`: JWT de cuenta (personal/dueño), 15 min, con refresh rotativo.
    - `x-permission` en cada operación indica el permiso requerido; el backend valida permiso **y** alcance.
    - Recurso de otra sesión o restaurante: `404` (no `403`) para no revelar existencia.

    ## Idempotencia
    Las operaciones con el parámetro `Idempotency-Key` lo exigen (UUID v4 por intento lógico).
    Mismo key y mismo cuerpo: misma respuesta con `Idempotent-Replayed: true`.
    Mismo key y cuerpo distinto: `422 IDEMPOTENCY_KEY_REUSED`. Falta el header: `400 IDEMPOTENCY_KEY_REQUIRED`.
    Misma key todavía en proceso: `409 IDEMPOTENCY_IN_PROGRESS` (reintentar en 1–2 s).

    ## Errores
    Todos los errores usan `application/problem+json` (RFC 7807 extendido, ver `Problem`).
    Los clientes se programan contra `code`, nunca contra `title`/`detail`.

    ## Alcance de esta versión
    Incluye menú, acceso por QR, sesión, pedidos, cuenta, pagos (con propina), ajustes, llamados al mozo, autenticación del personal,
    operación del personal, tiempo real y sistema. **Fuera de esta versión:** administración (`/admin/*`, Fase 8), registro de
    clientes (Fase 9), encuesta, retiro por mostrador y el flujo `requireStaffToOpenSession` (falta definir su estado).
  contact:
    name: Somphie Zúrich
servers:
  - url: http://localhost:8080/api/v1
    description: Backend local
  - url: http://localhost:4010/api/v1
    description: Prism (mock desde este archivo)
tags:
  - name: Menu
    description: Catálogo público
  - name: Access
    description: Acceso por QR, abrir sesión y unirse
  - name: Session
    description: Sesión actual y participantes (token de invitado)
  - name: Orders
    description: Pedidos del participante
  - name: Billing
    description: Cuenta, pagos y comprobante del participante
  - name: WaiterCalls
    description: Llamados al mozo
  - name: Auth
    description: Autenticación del personal
  - name: StaffOrders
    description: Cola de entrantes y decisión de pedidos
  - name: Preparation
    description: Estaciones, colas y transiciones de ítems
  - name: StaffFloor
    description: Tablero de mesas, sesiones y participantes
  - name: StaffBilling
    description: Cobros, reembolsos, ajustes y cierre
  - name: Realtime
    description: Eventos SSE
  - name: System
    description: Salud, versión y estáticos
security: []
paths:
  /menu:
    get:
      tags: [Menu]
      operationId: getMenu
      summary: Menú con categorías, productos y opciones
      description: |
        Devuelve textos ya localizados (`Accept-Language` o `?lang=`; fallback `es-AR`) y el `locale` efectivo.
        El restaurante se resuelve así (RN-TEN-03, D-144): con token (invitado o personal) manda el restaurante del token y, si `restaurantId`
        viene y es distinto, responde `404`; sin token se usa `restaurantId` y, si falta, el restaurante predeterminado del despliegue;
        un `restaurantId` desconocido responde `404`. La web obtiene `restaurantId` de `GET /public/tables/{tableCode}`.
        `ETag` débil = `catalogVersion` + idioma; la respuesta lleva `Vary: Accept-Language`.
      security: [{}, {guestToken: []}, {staffJwt: []}]
      x-permission: menu.read
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/RestaurantIdQuery'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Menú vigente
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Vary: {$ref: '#/components/headers/Vary'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MenuResponse'}
              examples:
                flatWhite:
                  summary: Menú con opciones (v0.2)
                  value:
                    catalogVersion: 42
                    locale: es-AR
                    currency: ARS
                    restaurantOpen: true
                    categories:
                      - id: 5c0f2a7e-3d41-4b8a-9a52-7e1d6f0a2b11
                        name: Café de especialidad
                        sortOrder: 1
                        products:
                          - id: 9a2b4c6d-8e0f-4a1b-b3c5-d7e9f1a3b5c7
                            name: Flat white
                            description: Doble espresso con leche texturizada.
                            priceMinor: 485000
                            available: true
                            station: BAR
                            allergens: [MILK]
                            image: {path: menu/flat-white.webp, version: 3, alt: Flat white en taza de cerámica}
                            optionGroups:
                              - id: 3f9e1d2c-4b5a-4687-9a0b-c1d2e3f4a5b6
                                name: Tamaño
                                selectionType: SINGLE
                                required: true
                                minSelections: 1
                                maxSelections: 1
                                options:
                                  - {id: d4e5f6a7-b8c9-4d0e-8f1a-2b3c4d5e6f70, name: Chico, priceDeltaMinor: 0, available: true, isDefault: true}
                                  - {id: e5f6a7b8-c9d0-4e1f-9a2b-3c4d5e6f7081, name: Grande, priceDeltaMinor: 80000, available: true, isDefault: false}
                              - id: 4a0f2e3d-5c6b-4798-8b1c-d2e3f4a5b6c7
                                name: Leche
                                selectionType: SINGLE
                                required: false
                                minSelections: 0
                                maxSelections: 1
                                options:
                                  - {id: f6a7b8c9-d0e1-4f2a-8b3c-4d5e6f708192, name: Avena, priceDeltaMinor: 60000, available: true, isDefault: false}
        '304':
          description: Sin cambios (`If-None-Match` coincide)
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /products/{productId}:
    get:
      tags: [Menu]
      operationId: getProduct
      summary: Detalle de un producto
      security: [{}, {guestToken: []}, {staffJwt: []}]
      x-permission: menu.read
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /public/tables/{tableCode}:
    get:
      tags: [Access]
      operationId: getPublicTable
      summary: Resolver el QR de una mesa
      description: |
        Solo expone etiqueta de mesa, el restaurante al que pertenece (`restaurantId`, para pedir el menú del local correcto, D-144) y si se puede abrir o unirse.
        Nunca revela pedidos, nombres ni saldo.
        Errores: `TABLE_CODE_INVALID` (404), `TABLE_UNAVAILABLE` (409).
      parameters:
        - $ref: '#/components/parameters/TableCode'
      responses:
        '200':
          description: Estado público de la mesa
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicTable'}
              examples:
                free:
                  value: {tableLabel: Mesa 7, restaurantId: 6f2d8a41-3b9c-4e75-a1d0-5c7e9b3f2a68, restaurantOpen: true, hasActiveSession: false, canOpen: true}
                occupied:
                  value: {tableLabel: Mesa 7, restaurantId: 6f2d8a41-3b9c-4e75-a1d0-5c7e9b3f2a68, restaurantOpen: true, hasActiveSession: true, canOpen: false}
                closed:
                  value: {tableLabel: Mesa 7, restaurantId: 6f2d8a41-3b9c-4e75-a1d0-5c7e9b3f2a68, restaurantOpen: false, opensAt: '2026-10-12T11:00:00Z', hasActiveSession: false, canOpen: false}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /public/tables/{tableCode}/sessions:
    post:
      tags: [Access]
      operationId: openSession
      summary: Abrir la sesión de una mesa libre
      description: |
        Crea la sesión `OPEN`, el participante `HOST`, el `joinCode` y el token de invitado.
        Errores: `SESSION_ALREADY_OPEN` (carrera: la web pasa a unirse), `TABLE_UNAVAILABLE`, `RESTAURANT_CLOSED`, `TABLE_CODE_INVALID`.
      x-permission: session.open
      parameters:
        - $ref: '#/components/parameters/TableCode'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenSessionRequest'}
            example: {displayName: Clara}
      responses:
        '201':
          description: Sesión abierta
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionAccessResponse'}
              example:
                session: {id: 5d3e8f10-2a4b-4c6d-9e8f-0a1b2c3d4e5f, status: OPEN, tableLabel: Mesa 7, openedAt: '2026-10-11T15:00:10Z', readOnly: false}
                participant: {id: ab12cd34-ef56-4789-8abc-def012345678, displayName: Clara, role: HOST}
                guestToken: gt_x8Jm3kQ0vZt9Lw2PfR7uYb1NcD4eHs6A
                joinCode: K7M2QX
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Conflicto
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                sessionAlreadyOpen: {$ref: '#/components/examples/ProblemSessionAlreadyOpen'}
                restaurantClosed: {$ref: '#/components/examples/ProblemRestaurantClosed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /public/tables/{tableCode}/join:
    post:
      tags: [Access]
      operationId: joinSession
      summary: Unirse a la sesión abierta con el código
      description: |
        Errores: `JOIN_CODE_REQUIRED`, `JOIN_CODE_INVALID`, `JOIN_CODE_RATE_LIMITED` (5 fallos/10 min por IP+mesa), `SESSION_FULL`, `SESSION_CLOSED`.
        Rol del participante nuevo (D-143, RN-ACC-14 y RN-ACC-15): normalmente `MEMBER`. Una sesión abierta por el personal (`openSessionAsStaff`) nace **sin `HOST`**
        y el primero en unirse pasa a serlo; los siguientes son `MEMBER`. La base garantiza un solo `HOST` por sesión: si dos personas se unen a la vez,
        una queda `HOST` y la otra `MEMBER` **sin error** (no hay un `409` por esto). Los clientes leen `participant.role` de la respuesta y no lo suponen.
      x-permission: session.join
      parameters:
        - $ref: '#/components/parameters/TableCode'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JoinSessionRequest'}
            example: {displayName: Sofi, joinCode: K7M2QX}
      responses:
        '201':
          description: Participante creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionAccessResponse'}
              examples:
                member:
                  summary: Se une a una sesión que ya tiene HOST
                  value:
                    session: {id: 5d3e8f10-2a4b-4c6d-9e8f-0a1b2c3d4e5f, status: OPEN, tableLabel: Mesa 7, openedAt: '2026-10-11T15:00:10Z', readOnly: false}
                    participant: {id: 0d1e2f3a-4b5c-4d6e-8f7a-8b9c0d1e2f3a, displayName: Sofi, role: MEMBER}
                    guestToken: gt_Qp4Zs8Vn1Mt6Xc3LjH9aBw2RuYe5DkF7
                firstJoinerBecomesHost:
                  summary: Primer participante de una sesión abierta por el personal (queda HOST)
                  value:
                    session: {id: 5d3e8f10-2a4b-4c6d-9e8f-0a1b2c3d4e5f, status: OPEN, tableLabel: Mesa 7, openedAt: '2026-10-11T15:00:10Z', readOnly: false}
                    participant: {id: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f, displayName: Lucía, role: HOST}
                    guestToken: gt_Hs2Tk7Wm0Pq5Zb8NdC3vXe1RjY6LaF4U
        '400': {$ref: '#/components/responses/BadRequest'}
        '403':
          description: Código ausente o incorrecto
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                joinCodeInvalid: {$ref: '#/components/examples/ProblemJoinCodeInvalid'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /sessions/current:
    get:
      tags: [Session]
      operationId: getCurrentSession
      summary: Sesión actual del participante
      description: |
        Tras el cierre, el token pasa a solo lectura durante 24 h: responde `200` con `status: CLOSED` y `readOnly: true`
        (la web muestra "Visita finalizada" y el comprobante). Pasadas las 24 h: `401 TOKEN_EXPIRED`.
        El `joinCode` solo se incluye para el `HOST` mientras la sesión está `OPEN`.
      security: [{guestToken: []}]
      responses:
        '200':
          description: Sesión y participante actual
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentSession'}
              example:
                session: {id: 5d3e8f10-2a4b-4c6d-9e8f-0a1b2c3d4e5f, status: OPEN, tableLabel: Mesa 7, openedAt: '2026-10-11T15:00:10Z', readOnly: false}
                participant: {id: ab12cd34-ef56-4789-8abc-def012345678, displayName: Clara, role: HOST}
                joinCode: K7M2QX
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /sessions/current/participants:
    get:
      tags: [Session]
      operationId: listParticipants
      summary: Participantes de la sesión
      security: [{guestToken: []}]
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Participant'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /sessions/current/participants/{participantId}:
    delete:
      tags: [Session]
      operationId: revokeParticipant
      summary: Revocar a un participante (solo HOST)
      description: |
        Acceso retirado de inmediato; sus pedidos ya enviados se conservan. El HOST no puede revocarse a sí mismo (`HOST_CANNOT_BE_REVOKED`, 409); el personal sí puede revocarlo.
      security: [{guestToken: []}]
      x-permission: participant.manage
      parameters:
        - $ref: '#/components/parameters/ParticipantId'
      responses:
        '200':
          description: Participante revocado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Participant'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /sessions/current/join-code/rotate:
    post:
      tags: [Session]
      operationId: rotateJoinCode
      summary: Rotar el código de la sesión (solo HOST)
      description: Los ya unidos siguen; el código viejo falla con `JOIN_CODE_INVALID`.
      security: [{guestToken: []}]
      x-permission: participant.manage
      responses:
        '200':
          description: Código nuevo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JoinCodeResponse'}
              example: {joinCode: R4T8WN}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /sessions/current/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Enviar un pedido
      description: |
        En una transacción: valida producto, disponibilidad, opciones y límites; calcula precios; compara con `acknowledgedTotalMinor`;
        crea pedido `PENDING_REVIEW` con snapshot por ítem.
        Errores 409: `PRICE_CHANGED` (incluye precios vigentes; reenviar con **nueva** clave), `PRODUCT_UNAVAILABLE`, `OPTION_UNAVAILABLE`,
        `ORDER_PENDING_LIMIT_REACHED`, `SESSION_CLOSED`, `RESTAURANT_CLOSED`.
        Errores 422: `ORDER_EMPTY`, `ORDER_TOO_MANY_LINES`, `ORDER_QUANTITY_EXCEEDED`, `PRODUCT_NOT_FOUND`, `OPTION_NOT_FOUND`, `OPTION_SELECTION_INVALID`.
      security: [{guestToken: []}]
      x-permission: order.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrderRequest'}
            examples:
              simple:
                value:
                  items:
                    - {productId: 9a2b4c6d-8e0f-4a1b-b3c5-d7e9f1a3b5c7, quantity: 2, note: Sin azúcar}
                    - {productId: 77cd1e2f-3a4b-4c5d-8e6f-7a8b9c0d1e2f, quantity: 1}
                  note: Gracias
                  acknowledgedTotalMinor: 1450000
              withOptions:
                value:
                  items:
                    - {productId: 9a2b4c6d-8e0f-4a1b-b3c5-d7e9f1a3b5c7, quantity: 1, optionIds: [e5f6a7b8-c9d0-4e1f-9a2b-3c4d5e6f7081, f6a7b8c9-d0e1-4f2a-8b3c-4d5e6f708192], note: Bien caliente}
                  acknowledgedTotalMinor: 625000
      responses:
        '201':
          description: Pedido creado
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
              example:
                id: e91a7b3c-5d2f-4e8a-9b1c-3d5f7a9b1c2e
                displayCode: '#042'
                status: PENDING_REVIEW
                version: 1
                createdBy: {participantId: ab12cd34-ef56-4789-8abc-def012345678, displayName: Clara}
                createdAt: '2026-10-11T15:03:22Z'
                note: Gracias
                items:
                  - {id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d, productId: 9a2b4c6d-8e0f-4a1b-b3c5-d7e9f1a3b5c7, productName: Flat white, basePriceMinor: 485000, optionsDeltaMinor: 0, unitPriceMinor: 485000, quantity: 2, lineTotalMinor: 970000, station: BAR, status: PENDING, note: Sin azúcar}
                  - {id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e, productId: 77cd1e2f-3a4b-4c5d-8e6f-7a8b9c0d1e2f, productName: Medialuna, basePriceMinor: 480000, optionsDeltaMinor: 0, unitPriceMinor: 480000, quantity: 1, lineTotalMinor: 480000, station: KITCHEN, status: PENDING}
                totalMinor: 1450000
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Conflicto
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                priceChanged: {$ref: '#/components/examples/ProblemPriceChanged'}
                productUnavailable: {$ref: '#/components/examples/ProblemProductUnavailable'}
                sessionClosed: {$ref: '#/components/examples/ProblemSessionClosed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      tags: [Orders]
      operationId: listSessionOrders
      summary: Todos los pedidos de la sesión (cuenta compartida)
      security: [{guestToken: []}]
      x-permission: bill.read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Pedidos de la sesión, del más reciente al más antiguo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Detalle de un pedido de la sesión
      description: Un pedido de otra sesión responde `404 ORDER_NOT_FOUND`.
      security: [{guestToken: []}]
      x-permission: bill.read
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /orders/{orderId}/cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancelar un pedido pendiente (autor o HOST)
      description: "Solo `PENDING_REVIEW`. Si ya fue decidido: `ORDER_NOT_CANCELLABLE` (409). Cancelar dos veces devuelve el estado actual."
      security: [{guestToken: []}]
      x-permission: order.cancel_own
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Pedido cancelado
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /sessions/current/bill:
    get:
      tags: [Billing]
      operationId: getBill
      summary: Cuenta derivada de la sesión
      description: |
        `balanceMinor = chargesMinor - adjustmentsMinor - paidMinor`. La propina (`tipsMinor`) **no** entra en el saldo.
        Los ajustes se muestran con etiqueta genérica; el motivo interno solo lo ve el personal.
        Usa precios históricos (snapshot), nunca el catálogo actual.
      security: [{guestToken: []}]
      x-permission: bill.read
      responses:
        '200':
          description: Cuenta
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bill'}
              example:
                currency: ARS
                chargesMinor: 1450000
                adjustmentsMinor: 145000
                paidMinor: 500000
                balanceMinor: 805000
                tipsMinor: 50000
                lines:
                  - {orderCode: '#042', productName: Flat white, quantity: 2, unitPriceMinor: 485000, lineTotalMinor: 970000}
                adjustments:
                  - {id: 8a9b0c1d-2e3f-4a4b-9c5d-6e7f8a9b0c1d, kind: DISCOUNT_PERCENT, label: Descuento, amountMinor: 145000}
                payments:
                  - {id: 6e7f8a9b-0c1d-4e2f-8a3b-4c5d6e7f8a9b, kind: PAYMENT, method: SIMULATED_ONLINE, status: SUCCEEDED, amountMinor: 500000, tipMinor: 50000, payerName: Clara, createdAt: '2026-10-11T15:40:00Z'}
                pendingOrdersNotIncluded:
                  - {orderCode: '#043', totalMinor: 300000}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /sessions/current/payments:
    post:
      tags: [Billing]
      operationId: createPayment
      summary: Pagar (simulado, total o parcial, con propina opcional)
      description: |
        Con lock exclusivo de la sesión. `amountMinor` entre `min(minPaymentMinor, saldo)` y el saldo: si el saldo es menor al mínimo, se paga exactamente el saldo (D-158).
        `0` solo si hay `tipMinor > 0` (pago solo propina, que no se rechaza por saldo 0, D-146).
        La propina no reduce el saldo; si el monto principal falla, la propina tampoco se registra.
        En modo demo, un importe terminado en `.13` simula rechazo: `422 PAYMENT_DECLINED` y queda un registro `FAILED` sin cambiar el saldo.
        Nunca se piden ni guardan datos de tarjeta.
        Errores 409: `PAYMENT_EXCEEDS_BALANCE` (trae `balanceMinor`), `PAYMENT_NOTHING_TO_PAY`, `TIP_NOT_ALLOWED` (no hay cargos en la sesión, D-147), `SESSION_CLOSED`.
        Errores 422: `PAYMENT_AMOUNT_INVALID` (trae `minMinor`, ya calculado con el saldo: `min(minPaymentMinor, saldo)`, D-158), `PAYMENT_DECLINED`,
        `TIP_INVALID`, `TIP_EXCEEDS_LIMIT` (trae `maxTipMinor`).
      security: [{guestToken: []}]
      x-permission: payment.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePaymentRequest'}
            examples:
              partial: {value: {amountMinor: 500000, tipMinor: 50000, method: SIMULATED_ONLINE}}
              tipOnly: {value: {amountMinor: 0, tipMinor: 50000, method: SIMULATED_ONLINE}}
      responses:
        '201':
          description: Pago registrado
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: Conflicto de saldo, sin cargos para la propina o sesión cerrada
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                exceedsBalance: {$ref: '#/components/examples/ProblemPaymentExceedsBalance'}
                tipNotAllowed: {$ref: '#/components/examples/ProblemTipNotAllowed'}
                sessionClosed: {$ref: '#/components/examples/ProblemSessionClosed'}
        '422':
          description: Regla de negocio violada con datos válidos (monto fuera de rango, rechazo simulado, propina inválida o sobre el tope)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                amountInvalid: {$ref: '#/components/examples/ProblemPaymentAmountInvalid'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      tags: [Billing]
      operationId: listPayments
      summary: Historial de pagos de la sesión
      security: [{guestToken: []}]
      x-permission: bill.read
      responses:
        '200':
          description: Pagos
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Payment'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
